# Local PostgreSQL for Project Aurora (M3). Private by default: bound to 127.0.0.1 only.
#   npm run db:up      start (waits until healthy)
#   npm run db:down    stop (data is kept in the named volume)
#   docker compose down -v   stop AND delete all data
services:
  db:
    image: postgres:16-alpine
    container_name: aurora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora   # local demo credentials only — change for any shared environment
      POSTGRES_DB: aurora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aurora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  aurora-pgdata:
